<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family:"DM Sans"; font-weight:700; src:url("../assets/fonts/DMSans-700.woff2") format("woff2"); }
  @font-face { font-family:"JetBrains Mono"; font-weight:700; src:url("../assets/fonts/JetBrainsMono-700.woff2") format("woff2"); }
  html, body { margin:0; width:1080px; height:1920px; overflow:hidden; }
  body { font-family:"DM Sans", system-ui, sans-serif; font-weight:700; color:#F5F1E8; position:relative;
    background:
      radial-gradient(80% 40% at 50% 100%, rgba(255,176,32,.42), rgba(255,176,32,0) 70%),
      radial-gradient(70% 35% at 50% 0%, rgba(10,240,240,.18), rgba(10,240,240,0) 70%), #0E1116; }
  .grid { position:absolute; inset:0; opacity:.16; background-image:
      linear-gradient(rgba(245,241,232,.12) 2px, transparent 2px), linear-gradient(90deg, rgba(245,241,232,.12) 2px, transparent 2px);
      background-size:90px 90px; }
  .c { color:#0AF0F0; text-shadow:0 0 40px rgba(10,240,240,.65); }
  .a { color:#FFB020; text-shadow:0 0 40px rgba(255,176,32,.55); }
  .part { position:absolute; top:100px; left:50%; transform:translateX(-50%); padding:18px 44px; border-radius:9999px; white-space:nowrap;
    border:4px solid #FFB020; background:rgba(255,176,32,.12); color:#FFB020; font-family:"JetBrains Mono", monospace; font-size:50px; letter-spacing:.12em; }
  .t1 { position:absolute; top:250px; left:0; right:0; text-align:center; font-size:120px; line-height:1; letter-spacing:-.03em; }
  .t2 { position:absolute; top:370px; left:0; right:0; text-align:center; font-size:230px; line-height:1; letter-spacing:-.04em; }
  .rec { position:absolute; left:170px; right:170px; top:680px; background:#F5F1E8; color:#0E1116; border-radius:16px; padding:50px 60px 44px;
    font-family:"JetBrains Mono", monospace; box-shadow:0 30px 90px rgba(0,0,0,.6); transform:rotate(-3deg); }
  .rec .h { text-align:center; font-size:52px; letter-spacing:.2em; margin-bottom:28px; }
  .rec .r { display:flex; justify-content:space-between; font-size:46px; height:72px; }
  .rec .tot { display:flex; justify-content:space-between; font-size:70px; border-top:5px dashed rgba(14,17,22,.4); padding-top:24px; margin-top:16px; }
  .chips { position:absolute; top:1330px; left:60px; right:60px; display:flex; flex-wrap:wrap; justify-content:center; gap:18px; }
  .chip { padding:12px 28px; border-radius:9999px; border:3px solid #0AF0F0; color:#0AF0F0; background:rgba(10,240,240,.12);
    font-family:"JetBrains Mono", monospace; font-size:38px; }
  .badge { position:absolute; left:50%; top:1560px; transform:translateX(-50%) rotate(-3deg); background:#FFB020; color:#0E1116;
    font-size:80px; padding:22px 48px; border-radius:24px; white-space:nowrap; box-shadow:0 20px 60px rgba(255,176,32,.45); }
  .brand { position:absolute; bottom:60px; left:0; right:0; text-align:center; font-size:46px; color:rgba(245,241,232,.8); letter-spacing:.06em; }
</style></head>
<body>
  <div class="grid"></div>
  <div class="part">PART 7 · FINALE</div>
  <div class="t1">Chai ka</div>
  <div class="t2 a">BILL</div>
  <div class="rec">
    <div class="h">CHAI BILL</div>
    <div class="r"><span>Masala x2</span><span>Rs 40</span></div>
    <div class="r"><span>Adrak x1</span><span>Rs 15</span></div>
    <div class="r"><span>Discount</span><span style="color:#C2185B">-Rs 5</span></div>
    <div class="tot"><span>TOTAL</span><span style="color:#B86E00">Rs 50</span></div>
  </div>
  <div class="chips"><span class="chip">function</span><span class="chip">if-else</span><span class="chip">list</span><span class="chip">for loop</span><span class="chip">dict</span></div>
  <div class="badge">MINI PROJECT!</div>
  <div class="brand">SAMJHO WITH RAJ</div>
</body></html>
