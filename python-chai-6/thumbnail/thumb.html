<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family:"DM Sans"; font-weight:700; src:url("../assets/fonts/DMSans-700.woff2") format("woff2"); }
  @font-face { font-family:"JetBrains Mono"; font-weight:700; src:url("../assets/fonts/JetBrainsMono-700.woff2") format("woff2"); }
  html, body { margin:0; width:1080px; height:1920px; overflow:hidden; }
  body { font-family:"DM Sans", system-ui, sans-serif; font-weight:700; color:#F5F1E8; position:relative;
    background:
      radial-gradient(80% 40% at 50% 100%, rgba(255,176,32,.42), rgba(255,176,32,0) 70%),
      radial-gradient(70% 35% at 50% 0%, rgba(10,240,240,.18), rgba(10,240,240,0) 70%), #0E1116; }
  .grid { position:absolute; inset:0; opacity:.16; background-image:
      linear-gradient(rgba(245,241,232,.12) 2px, transparent 2px), linear-gradient(90deg, rgba(245,241,232,.12) 2px, transparent 2px);
      background-size:90px 90px; }
  .c { color:#0AF0F0; text-shadow:0 0 40px rgba(10,240,240,.65); }
  .a { color:#FFB020; text-shadow:0 0 40px rgba(255,176,32,.55); }
  .part { position:absolute; top:110px; left:50%; transform:translateX(-50%); padding:18px 44px; border-radius:9999px;
    border:4px solid #0AF0F0; background:rgba(10,240,240,.12); font-family:"JetBrains Mono", monospace; font-size:56px; letter-spacing:.12em; }
  .t1 { position:absolute; top:270px; left:0; right:0; text-align:center; font-size:130px; line-height:1; letter-spacing:-.03em; }
  .t2 { position:absolute; top:410px; left:0; right:0; text-align:center; font-size:170px; line-height:1; letter-spacing:-.04em; }
  .menu { position:absolute; left:110px; right:110px; top:650px; background:#181715; border:4px solid rgba(245,241,232,.25); border-radius:34px;
    padding:40px 56px; box-shadow:0 30px 90px rgba(0,0,0,.6); transform:rotate(-2deg); }
  .menu .k { font-family:"JetBrains Mono", monospace; font-size:40px; letter-spacing:.2em; color:rgba(245,241,232,.66); margin-bottom:14px; }
  .row { display:flex; align-items:center; gap:22px; height:110px; font-size:64px; }
  .row .dot { width:30px; height:30px; border-radius:50%; flex:none; }
  .row .lead { flex:1; border-bottom:5px dotted rgba(245,241,232,.3); transform:translateY(16px); }
  .row .p { font-family:"JetBrains Mono", monospace; color:#FFB020; font-size:62px; }
  .row.hl { background:rgba(10,240,240,.14); border:4px solid #0AF0F0; border-radius:18px; margin:0 -24px; padding:0 20px; }
  .code { position:absolute; top:1180px; left:0; right:0; text-align:center; font-family:"JetBrains Mono", monospace; font-size:60px; }
  .badge { position:absolute; left:50%; top:1440px; transform:translateX(-50%) rotate(-3deg); background:#FFB020; color:#0E1116;
    font-size:76px; padding:22px 48px; border-radius:24px; white-space:nowrap; box-shadow:0 20px 60px rgba(255,176,32,.45); }
  .brand { position:absolute; bottom:60px; left:0; right:0; text-align:center; font-size:46px; color:rgba(245,241,232,.8); letter-spacing:.06em; }
</style></head>
<body>
  <div class="grid"></div>
  <div class="part">PART 6</div>
  <div class="t1">Masala chai</div>
  <div class="t2 a">kitne ki?</div>
  <div class="menu">
    <div class="k">CHAI MENU</div>
    <div class="row hl"><span class="dot" style="background:#C8782A"></span>Masala<span class="lead"></span><span class="p">Rs 20</span></div>
    <div class="row"><span class="dot" style="background:#E8C26A"></span>Adrak<span class="lead"></span><span class="p">Rs 15</span></div>
    <div class="row"><span class="dot" style="background:#8CCB7E"></span>Elaichi<span class="lead"></span><span class="p">Rs 25</span></div>
  </div>
  <div class="code">menu[<span class="c">"Masala"</span>] = <span class="a">20</span></div>
  <div class="badge">DICTIONARY SAMJHO!</div>
  <div class="brand">SAMJHO WITH RAJ</div>
</body></html>
