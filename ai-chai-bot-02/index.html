<!doctype html>

  <head>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #F5F1E8;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
          #cam { position:absolute; left:770px; top:770px; width:320px; height:320px; z-index:50;
        filter: drop-shadow(0 0 22px rgba(10,240,240,.30)) drop-shadow(0 10px 30px rgba(0,0,0,.6)); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="61.66" data-width="1080" data-height="1080">
      <div id="el-01-hook" class="scene" data-composition-id="01-hook" data-composition-src="compositions/frames/01-hook.html"

      <div id="el-02-chat" class="scene" data-composition-id="02-chat" data-composition-src="compositions/frames/02-chat.html"

      <audio id="el-voice" src="assets/audio/voice.m4a" data-start="0" data-duration="60.96" data-track-index="11" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      (function () { var tl = window.__timelines["main"];
        tl.fromTo("#cam", { y: 340 }, { y: 0, duration: 0.6, ease: "power3.out" }, 0.15);
        tl.to("#cam", { opacity: 0, y: 30, duration: 0.45, ease: "power2.in" }, 60.56);
        tl.to("#el-01-hook", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 4.7);
        tl.fromTo("#el-02-chat", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 4.7);
        tl.to("#el-02-chat", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 17.52);
        tl.fromTo("#el-03-fork", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 17.52);
        tl.to("#el-03-fork", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 31.82);
        tl.fromTo("#el-04-code", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 31.82);
