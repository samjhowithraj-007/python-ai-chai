<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #F5F1E8;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-g9l0" id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1080">
      <div data-hf-id="hf-to9h" id="el-01-hook" class="scene" data-composition-id="01-hook" data-composition-src="compositions/frames/01-hook.html" data-start="0" data-duration="4.5" data-track-index="0"></div>

      <div data-hf-id="hf-3csp" id="el-02-recap" class="scene" data-composition-id="02-recap" data-composition-src="compositions/frames/02-recap.html" data-start="4" data-duration="6.5" data-track-index="1"></div>

      <div data-hf-id="hf-ku83" id="el-03-run" class="scene" data-composition-id="03-run" data-composition-src="compositions/frames/03-run.html" data-start="10" data-duration="7.5" data-track-index="0"></div>

      <div data-hf-id="hf-hqi5" id="el-04-return" class="scene" data-composition-id="04-return" data-composition-src="compositions/frames/04-return.html" data-start="17" data-duration="7.5" data-track-index="1"></div>

      <div data-hf-id="hf-dd93" id="el-05-cta" class="scene" data-composition-id="05-cta" data-composition-src="compositions/frames/05-cta.html" data-start="24" data-duration="6" data-track-index="0"></div>

      <!-- BGM -->
      <audio data-hf-id="hf-he9m" id="el-bgm" src="assets/audio/bgm.mp3" data-start="0" data-duration="30" data-track-index="11" data-volume="0.9"></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 4);
        tl.fromTo("#el-02-recap", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 4);
        tl.addLabel("hf:transition:01-hook:02-recap:crossfade", 4);
        tl.to("#el-02-recap", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 10);
        tl.fromTo("#el-03-run", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 10);
        tl.addLabel("hf:transition:02-recap:03-run:crossfade", 10);
        tl.to("#el-03-run", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 17);
        tl.fromTo("#el-04-return", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 17);
        tl.addLabel("hf:transition:03-run:04-return:crossfade", 17);
        tl.to("#el-04-return", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 24);
        tl.fromTo("#el-05-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 24);
        tl.addLabel("hf:transition:04-return:05-cta:crossfade", 24);
        tl.to({}, { duration: 30 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
