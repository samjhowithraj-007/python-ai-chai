<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family:"DM Sans"; font-weight:700; src:url("../assets/fonts/DMSans-700.woff2") format("woff2"); }
  @font-face { font-family:"JetBrains Mono"; font-weight:700; src:url("../assets/fonts/JetBrainsMono-700.woff2") format("woff2"); }
  html, body { margin:0; width:1080px; height:1920px; overflow:hidden; }
  body { font-family:"DM Sans", system-ui, sans-serif; font-weight:700; color:#F5F1E8; position:relative;
    background:
      radial-gradient(80% 40% at 50% 100%, rgba(255,176,32,.42), rgba(255,176,32,0) 70%),
      radial-gradient(70% 35% at 50% 0%, rgba(10,240,240,.18), rgba(10,240,240,0) 70%), #0E1116; }
  .grid { position:absolute; inset:0; opacity:.16; background-image:
      linear-gradient(rgba(245,241,232,.12) 2px, transparent 2px), linear-gradient(90deg, rgba(245,241,232,.12) 2px, transparent 2px);
      background-size:90px 90px; }
  .c { color:#0AF0F0; text-shadow:0 0 40px rgba(10,240,240,.65); }
  .a { color:#FFB020; text-shadow:0 0 40px rgba(255,176,32,.55); }
  .part { position:absolute; top:100px; left:50%; transform:translateX(-50%); padding:18px 44px; border-radius:9999px; white-space:nowrap;
    border:4px solid #0AF0F0; background:rgba(10,240,240,.12); font-family:"JetBrains Mono", monospace; font-size:50px; letter-spacing:.1em; }
  .t1 { position:absolute; top:260px; left:0; right:0; text-align:center; font-size:140px; line-height:1; letter-spacing:-.03em; }
  .t2 { position:absolute; top:410px; left:0; right:0; text-align:center; font-size:150px; line-height:1; letter-spacing:-.04em; }
  .bot { position:absolute; left:290px; top:640px; filter:drop-shadow(0 0 60px rgba(10,240,240,.6)); }
  .code { position:absolute; top:1180px; left:0; right:0; text-align:center; font-family:"JetBrains Mono", monospace; font-size:84px; }
  .badge { position:absolute; left:50%; top:1420px; transform:translateX(-50%) rotate(-3deg); background:#FFB020; color:#0E1116;
    font-size:72px; padding:22px 48px; border-radius:24px; white-space:nowrap; box-shadow:0 20px 60px rgba(255,176,32,.45); }
  .brand { position:absolute; bottom:60px; left:0; right:0; text-align:center; font-size:46px; color:rgba(245,241,232,.8); letter-spacing:.06em; }
</style></head>
<body>
  <div class="grid"></div>
  <div class="part">AI + PYTHON · PART 1</div>
  <div class="t1">Chai ka</div>
  <div class="t2"><span class="a">chatbot</span> banao!</div>
  <svg class="bot" viewBox="0 0 200 200" width="500" height="500" fill="none">
    <path d="M100 22 L100 42" stroke="#F5F1E8" stroke-width="7" stroke-linecap="round"/>
    <circle cx="100" cy="16" r="11" fill="#FFB020"/>
    <rect x="14" y="88" width="16" height="40" rx="6" fill="#0AF0F0" opacity=".7"/>
    <rect x="170" y="88" width="16" height="40" rx="6" fill="#0AF0F0" opacity=".7"/>
    <rect x="30" y="42" width="140" height="128" rx="36" fill="#181715" stroke="#0AF0F0" stroke-width="7"/>
    <ellipse cx="74" cy="100" rx="14" ry="17" fill="#0AF0F0"/>
    <ellipse cx="126" cy="100" rx="14" ry="17" fill="#0AF0F0"/>
    <path d="M72 135 Q100 156 128 135" stroke="#F5F1E8" stroke-width="7" stroke-linecap="round"/>
  </svg>
  <div class="code"><span class="c">input</span> + <span class="c">print</span> + <span class="c">loop</span></div>
  <div class="badge">50 parts · AI agent tak!</div>
  <div class="brand">SAMJHO WITH RAJ · <span class="c">samjhowithraj.online</span></div>
</body></html>
