<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #F5F1E8;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
          #cam { position:absolute; left:770px; top:770px; width:320px; height:320px; z-index:50;
        filter: drop-shadow(0 0 22px rgba(10,240,240,.30)) drop-shadow(0 10px 30px rgba(0,0,0,.6)); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="39.0" data-width="1080" data-height="1080">
      <div id="el-01-hook" class="scene" data-composition-id="01-hook" data-composition-src="compositions/frames/01-hook.html"
        data-start="0" data-duration="3.95" data-track-index="0"></div>
      <div id="el-02-chat" class="scene" data-composition-id="02-chat" data-composition-src="compositions/frames/02-chat.html"
        data-start="3.45" data-duration="6.8" data-track-index="1"></div>
      <div id="el-03-three" class="scene" data-composition-id="03-three" data-composition-src="compositions/frames/03-three.html"
        data-start="9.75" data-duration="5.95" data-track-index="0"></div>
      <div id="el-04-code" class="scene" data-composition-id="04-code" data-composition-src="compositions/frames/04-code.html"
        data-start="15.2" data-duration="9.4" data-track-index="1"></div>
      <div id="el-05-cta" class="scene" data-composition-id="05-cta" data-composition-src="compositions/frames/05-cta.html"
        data-start="24.1" data-duration="14.9" data-track-index="0"></div>

      <!-- Raj, background removed, bottom-right -->
      <video id="cam" class="clip" src="assets/cam/face-cut.webm" playsinline muted
        data-start="0" data-duration="38.26" data-track-index="5"></video>

      <!-- Raj's voice (music bed is mixed in after the render, ducked under it) -->
      <audio id="el-voice" src="assets/audio/voice.m4a" data-start="0" data-duration="38.26" data-track-index="11" data-volume="1"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      (function () { var tl = window.__timelines["main"];
        tl.fromTo("#cam", { y: 340 }, { y: 0, duration: 0.6, ease: "power3.out" }, 0.15);
        tl.to("#cam", { opacity: 0, y: 30, duration: 0.45, ease: "power2.in" }, 37.85);
        tl.to("#el-01-hook", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 3.45);
        tl.fromTo("#el-02-chat", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 3.45);
        tl.addLabel("hf:transition:01-hook:02-chat:crossfade", 3.45);
        tl.to("#el-02-chat", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 9.75);
        tl.fromTo("#el-03-three", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 9.75);
        tl.addLabel("hf:transition:02-chat:03-three:crossfade", 9.75);
        tl.to("#el-03-three", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 15.2);
        tl.fromTo("#el-04-code", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 15.2);
        tl.addLabel("hf:transition:03-three:04-code:crossfade", 15.2);
        tl.to("#el-04-code", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 24.1);
        tl.fromTo("#el-05-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 24.1);
        tl.addLabel("hf:transition:04-code:05-cta:crossfade", 24.1);
        tl.to({}, { duration: 39.0 }, 0); // full-span anchor
      })();
    </script>
  </body>
</html>
