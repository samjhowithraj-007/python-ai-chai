<title>Samjho Prompter</title>
<style>
/* Layout: one narrow reading column pinned to the top of the screen, right under the webcam; controls in a bottom bar.
   Deliberately single-theme dark: a prompter must be light text on black in every room. */
:root{
  --bg:#07090c; --ink:#f5f1e8; --dim:#7d8590; --cue:#ffb020; --key:#0af0f0; --bar:#12161c; --line:rgba(245,241,232,.14);
  --display:"DM Sans","Segoe UI",system-ui,sans-serif; --mono:"Cascadia Code",Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);overflow:hidden}
#stage{position:absolute;inset:0 0 calc(64px + env(safe-area-inset-bottom,0px)) 0;overflow:hidden;padding-inline:16px}
#scroller{max-width:var(--col,640px);margin:0 auto;padding-top:var(--eye,70px);will-change:transform}
#scroller.mirror{transform:scaleX(-1)}
.sec{font:700 .38em var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--cue);margin:1.4em 0 .3em}
.pt{font-weight:700;line-height:1.28;margin:0 0 .5em;text-wrap:pretty}
.pt b{color:var(--key);font-weight:700}
#eye{position:absolute;left:0;right:0;top:calc(var(--eye,70px) - 8px);height:3px;background:linear-gradient(90deg,transparent,var(--cue),transparent);opacity:.55;pointer-events:none}
#fade{position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(transparent,var(--bg));pointer-events:none}
#count{position:absolute;inset:0;display:grid;place-items:center;font:700 22vmin var(--display);color:var(--cue);background:rgba(7,9,12,.75)}
#bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bar);
  border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
#bar button,#bar select{background:#1c222b;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
#bar button:hover{border-color:var(--dim)}
#bar button.on{background:var(--cue);color:#111;border-color:var(--cue);font-weight:700}
#bar .val{min-width:3.2em;text-align:center;font-variant-numeric:tabular-nums;color:var(--dim)}
#bar .keys{margin-left:auto;color:var(--dim);font-size:12px}
@media (max-width:700px){#bar .keys{display:none}}
:focus-visible{outline:2px solid var(--key);outline-offset:2px}
#editor{position:fixed;inset:0;background:var(--bg);padding:16px;display:flex;flex-direction:column;gap:10px;z-index:5}
#editor textarea{flex:1;width:100%;background:#0f1318;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:14px;font:16px/1.5 var(--mono);resize:none}
#editor p{margin:0;color:var(--dim);font-size:14px;max-width:70ch}
#editor .row{display:flex;gap:8px;flex-wrap:wrap}
#editor button{background:#1c222b;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer}
#editor button.primary{background:var(--cue);color:#111;border-color:var(--cue);font-weight:700}
@media (prefers-reduced-motion:reduce){#count{transition:none}}
</style>

<div id="stage" aria-live="off">
  <div id="scroller"></div>
  <div id="eye" aria-hidden="true"></div>
  <div id="fade" aria-hidden="true"></div>
  <div id="count" hidden></div>
</div>

<div id="bar" role="toolbar" aria-label="Prompter controls">
  <select id="script" aria-label="Script"></select>
  <button id="play" type="button">▶ Start</button>
  <button id="top" type="button">⟲ Top</button>
  <span>Speed</span><button id="slow" type="button" aria-label="Slower">−</button><span class="val" id="speedv"></span><button id="fast" type="button" aria-label="Faster">+</button>
  <span>Text</span><button id="small" type="button" aria-label="Smaller text">A−</button><span class="val" id="sizev"></span><button id="big" type="button" aria-label="Bigger text">A+</button>
  <button id="narrow" type="button">Narrow</button>
  <button id="mirror" type="button">Mirror</button>
  <button id="edit" type="button">Edit script</button>
  <span class="keys">Space start/pause · ↑↓ speed · +/− text · Home top · E edit</span>
</div>

<div id="editor" hidden>
  <p>One talking point per line. A line starting with <b>#</b> is a scene label. Wrap a word in <b>*stars*</b> to colour it.
     Saved in this browser only.</p>
  <textarea id="text" aria-label="Script text" spellcheck="false"></textarea>
  <div class="row"><button id="save" class="primary" type="button">Save &amp; show</button><button id="reset" type="button">Restore original</button><button id="cancel" type="button">Cancel</button></div>
</div>

  "Part 4 — .lower() (PART 4/50)": `# 1 · Hook (frame 1 question) ⚡ confused face · show phone · fast

  "Paisa Samjho 1 (PART 1/20)": `# Paisa Samjho · PART 1/20 · 9:16 Short ~50 s ⚡ STAND · louder · smile · one gesture per punch word

  "Paisa Samjho 2 (PART 2/20)": `# Paisa Samjho · PART 2/20 · 9:16 Short ~45 s (~100 words) ⚡ STAND · louder · smile · one gesture per punch word

  "Paisa Samjho 3 (PART 3/20)": `# Paisa Samjho · PART 3/20 · 9:16 Short ~45 s (~100 words) ⚡ STAND · louder · smile · one gesture per punch word

  "Tech Explainer 2: AI jhooth (long)": `# 1 · Hook: Rohan ka assignment ⚡ storyteller · lean in · surprise on "exist hi nahi karti"
Yaad hai *Rohan*? Pichhli video mein usne AI ko apna *coach* banaya tha.
Is hafte college ka assignment tha. Rohan ne AI se poocha: "Indian Railways ki engineering ke itihaas pe *ek achhi book* batao, author aur saal ke saath."
AI ne turant jawab diya. Book ka naam, author, saal, *sab kuch*. Bilkul confident.
Rohan ne wahi assignment mein likh diya. Do din baad professor ne bulaya: "Rohan… ye book *exist hi nahi karti*."
Rohan shocked. *"AI ne mujhse jhooth bola?"*
Aur ye sirf Rohan ke saath nahi hua. America mein *lawyers ko court mein jurmana* bharna pada, ek airline ko *paise lautane pade*, aur ek badi company ke *ek din mein arbon dollar* doob gaye… sab AI ke ek confident galat jawab ki wajah se.
Aaj hum samjhenge: AI aisa *kyun* karta hai? Aur aap kaise bachoge? End mein ek *ek line ki trick* bhi hai, jo aap aaj se har prompt mein likh sakte ho.
# 2 · Intro ⚡ big smile · same first line every video
Main hoon *Raj*, Samjho with Raj pe aapka swagat hai. Yahan tech ko samjhate hain chai ki tarah, garam aur simple.
Aaj: *AI andar se kaise kaam karta hai*, aur woh *confident hokar galat* kyun bolta hai.
# 3 · Phone ka keyboard: LLM ka sabse simple matlab ⚡ demo energy · hold up your phone · type along
Ek kaam karo. Apna phone uthao, WhatsApp kholo, aur type karo: *"Chai mein…"*
Keyboard ke upar kuch shabd aayenge na? Jaise *"cheeni"*, *"adrak"*, *"doodh"*. Phone *andaza* laga raha hai ki aap *agla shabd* kya likhoge.
Bas. *ChatGPT jaisa AI bhi yahi karta hai.* Bas bahut, bahut bada.
Isse kehte hain *LLM*, Large Language Model. Isne internet, books aur articles ka itna saara text padha hai ki ye bahut achha andaza laga leta hai: *is sawaal ke baad kaunse shabd aane chahiye*.
Aur ye ek-ek *shabd ke tukde* jodta hai. In tukdon ko kehte hain *tokens*. "Samjho" shayad ek token ho, "techsamjhoraj" kai tokens mein toot jaata hai.
Toh jab aap sawaal poochte ho, AI *sochta nahi* ki "sach kya hai". Woh sochta hai: *"is jagah sabse sahi lagne wala agla shabd kya hoga?"*
# 4 · Safar: chatbot se ChatGPT tak ⚡ storyteller · one era per beat · point at the screen on each year
Ye ek din mein nahi bana. Chhota sa safar dekho.
*1966*, MIT mein *ELIZA* naam ka chatbot bana. Woh bas aapke shabd ulta-pulta karke wapas pooch leta tha. Phir bhi log usse dil ki baatein karne lage.
*1998*, *Google* aaya. Search ne *pages dhoondhe*, jawab aapko khud padhna padta tha.
*2017*, Google ke researchers ka ek paper aaya: *"Attention Is All You Need."* Isne *Transformer* diya, wahi "T" jo *ChatGPT* ke naam mein hai.
Aur *30 November 2022*, *ChatGPT* aaya. Pehli baar ek machine *insaan jaisi bhasha* mein jawab dene lagi.
Pattern dekha? Pehle machine *dhoondhti* thi. Ab machine *likhti* hai. Aur jo likhta hai… woh *galat bhi likh sakta hai*.
# 5 · Toh "jhooth" kyun? Woh dost jo kabhi "pata nahi" nahi bolta ⚡ conversational · smile on the dost line
Ab asli sawaal. Jab AI ko *jawab pata hi nahi*, toh woh "pata nahi" kyun nahi bolta?
Kyunki uska kaam hai *agla shabd jodna*. Rohan ne "book ka naam, author, saal" maanga. AI ne dekha hai ki aise sawaal ke baad *ek book ka naam, ek author, ek saal* aata hai. Toh usne *wahi pattern* bana diya. Sunne mein bilkul asli. Par *bana hua*.
Isko kehte hain *hallucination*: AI ka *confident hokar galat* bolna.
Hum sabka ek aisa *dost* hota hai na? Jo kabhi "pata nahi" nahi bolta. Rasta poocho toh bina jaane bata dega, "haan haan, seedha jao, phir left." 😄 AI kabhi-kabhi wahi dost hai.
Aur ye *jhooth* nahi hai, kyunki AI ka *iraada* nahi hota. Woh bas *sach aur sach-jaisa* mein farak nahi jaanta, jab tak aap use sahi jaankari na do.
# 6 · Asli kisse: jab confident galti mehngi padi ⚡ serious but quick · count on fingers · one case per beat
Ye sirf assignment ki baat nahi. Teen asli kisse suno.
*Ek*: *June 2023*, America. Lawyers ne court mein ek case file kiya, jisme *ChatGPT ke diye hue purane cases* likhe the. Problem? Woh cases *exist hi nahi karte the*. Judge ne lawyers pe *5,000 dollar ka jurmana* lagaya.
*Do*: *February 2024*, Canada. *Air Canada* ki website ke chatbot ne ek customer ko galat refund policy bata di. Tribunal ne kaha: chatbot aapki website ka hissa hai, *zimmedaari aapki*. Airline ko customer ko *paise dene pade*.
*Teen*: *February 2023*. Google ne apne naye AI *Bard* ka ad dikhaya, aur usi ad mein Bard ne space telescope ke baare mein *galat fact* bata diya. Usi din Google ki company Alphabet ki *market value lagbhag 100 billion dollar* gir gayi.
Lesson simple hai: *AI ka jawab, aapki zimmedaari.*
# 7 · Rohan ka sabak + 5 checks ⚡ coach energy · count 1–5 on fingers · one per beat
Rohan ne professor se maafi maangi, aur ek *checklist* banayi. Ye aapke liye bhi hai.
*Ek*: *Source maango, aur khud kholke dekho.* AI link de, toh link khulna chahiye, aur wahi baat likhi honi chahiye.
*Do*: *Naam, number, date* hamesha double-check karo. Google ya official website pe.
*Teen*: Ye *ek line* har prompt mein likho: *"Agar pakka nahi pata, toh bolo 'pata nahi'. Bana ke mat batao."*
*Chaar*: AI ko *apni jaankari do*. Apna notes, PDF ya document do, aur bolo: "sirf isi se jawab do." Isse galti bahut kam hoti hai. Isko *RAG* kehte hain, aur iski poori video aa rahi hai.
*Paanch*: *Health, law aur paise* ke faisle? AI se samjho, par *final faisla expert se*.
Rohan ne naya assignment likha, har source khud check karke. Professor ne kaha: *"Ab ye hai asli kaam."*
# 8 · Aage dekho: AI expert ka raasta ⚡ excited · point at the roadmap
Aur agar aap AI ko sirf *use* nahi, *samajhna aur banana* chahte ho, toh raasta ye hai.
Pehla step: *Python, zero se*. Hamari playlist hai *"Chai + Python: Zero se Coder tak"*.
Doosra: *AI + Python*: apna khud ka *chatbot* banao, jo sach mein ek LLM se baat karta hai.
Aur is *AI Explained* series mein aage: *MCP*, AI ka USB-C; aur *RAG*, AI ka open-book exam. Jo galti aaj dekhi, uska *ilaaj* RAG mein hai.
Aur jo AI se sirf baat nahi, *kaam karwana* chahte hain, unke liye hai *Agentic AI with Bunty*: humara AI intern Bunty, jo kabhi-kabhi aaj wali *confident galti* bhi karta hai. 😄 Wo series bhi isi channel pe hai.
Har video ke *free notes aur code* milenge *techsamjhoraj.com* pe. Aur wahan *email se sign up* kar lo, naye lessons, course updates aur discount offers sabse pehle aapko milenge.
# 9 · Rohan ka jawab + comment ⚡ warm · smile · look into the lens
Us shaam Rohan ne apne dost ko message kiya: *"Bhai, AI jhooth nahi bolta. Woh bas confident hai. Check karna humara kaam hai."* 😄
Aapke saath kabhi AI ne *confident galti* ki hai? *Comment mein batao*, sabse mazedaar wala agli video mein dikhayenge.
Video achhi lagi toh *subscribe* karo, aur us dost ko bhejo jo AI ka har jawab *aankh band karke* maan leta hai.`,
  "Tech Explainer 2: AI jhooth (Short)": `Rule (19 Oct): tech Shorts ≤ 45 s, the question in frame 1, end with what's next + follow. ~100 words ≈ 38 s.

  "Tech Explainer 1: AI aur Naukri (long)": `# 1 · Hook: Rohan ki raat ⚡ storyteller · quiet, lean in · smile only at the end
Raat ke 11 baje the. Indore mein *Rohan*, 22 saal, B.Tech final year, bed pe lete-lete phone scroll kar raha tha.
News pe headline: *"AI khatam kar dega lakhon naukriyan."*
Tabhi WhatsApp pe uske dost ka message aaya: *"Bhai, placement ka sapna chhod de. Ab sab kaam AI karega."*
Rohan ne phone side mein rakha… aur chhat ki taraf dekhta raha. *"Toh kya meri padhai bekaar gayi?"*
Agar aap bhi kabhi Rohan ki jagah the… toh ye video aapke liye hai. Kyunki aaj hum dost ki baat ya news ki headline nahi, *history aur official data* dekhenge: AI se naukri *jayegi*, ya *milegi*?
# 2 · Intro ⚡ big smile · same first line every video
Main hoon *Raj*, Samjho with Raj pe aapka swagat hai. Yahan tech ko samjhate hain chai ki tarah, garam aur simple.
Aaj: *steam engine se AI tak ka safar*, Rohan ke saath. Aur end mein *5 kaam* jo aap aaj se shuru kar sakte ho.
# 3 · Safar: papa ki kahani ⚡ storyteller · slow, one era per beat · point at the screen on each year
Agli subah nashte pe Rohan ne papa ko dost ka message dikhaya. Papa hans pade.
"Beta, ye darr *naya nahi hai*. Har badi technology ke saath yahi sawaal aaya hai." Toh chalo, papa ki kahani sunte hain.
*1760 ke aas-paas*, Britain mein *Industrial Revolution* shuru hui. Steam engine aaya, machines aayi, kapda haath ki jagah mill mein banne laga.
Log dare: *"machine humari roti chheen legi."* Kuch kaam sach mein gaye… lekin factory, railway aur mill mein *naye kaam* aaye jo pehle the hi nahi.
Phir *1946*. Duniya ne *ENIAC* dekha, ek computer jo *poore kamre* jitna bada tha. Aaj usse kahin zyada taakat Rohan ki *jeb ke phone* mein hai.
Phir wahi darr: "computer sab ka kaam kar dega." Aur hua kya? *Programmer, computer operator* jaisi nayi naukriyan aayi.
Ab apne desh ki baat. *15 August 1995*, VSNL ne India mein *public internet* shuru kiya.
Uske baad *IT era* aaya. Bengaluru, Hyderabad, Pune: *software engineer, web designer, call centre*… ye naukriyan pehle *thi hi nahi*, aur inhone lakhon Indian families ki zindagi badal di.
Papa ne chai ka cup rakha: "Mere time pe bhi log kehte the, computer aa gaya, ab clerk ki naukri gayi. Jinhone computer *seekha*, wo aage nikal gaye."
Aur ab *30 November 2022*. *ChatGPT* launch hua. Ek andaaze ke mutabik sirf *2 mahine* mein *10 crore* log use karne lage. Itni tezi se koi app nahi badha tha.
Pattern dekha? *Har baar kuch kaam gaye, aur usse zyada naye kaam aaye.* Aur har baar aage wohi badha jisne *nayi cheez seekhi*.
# 4 · Rohan ne data dekha ⚡ count on fingers
Lekin Rohan smart hai. Usne socha, "Papa ki kahani achhi hai, par *is baar ka data* kya kehta hai?"
World Economic Forum ki *Future of Jobs Report 2025* ne duniya bhar ki 1,000 se zyada companies se poocha.
Unka andaaza: 2030 tak *17 crore* nayi jobs banengi… aur *9 crore 20 lakh* jobs khatam ya badal jayengi. Matlab net mein *7 crore 80 lakh* jobs *zyada*.
Rohan ko samajh aaya: asli sawaal ye nahi ki "AI jobs khatam karega ya nahi". Asli sawaal ye hai: *jo nayi jobs banengi, unke liye main ready hoon ya nahi?*
Same report kehti hai ki sabse tezi se badhne wali skills hain *AI aur big data*, *networks aur cybersecurity*, aur *technology literacy*. Saath mein creativity aur *seekhte rehna*.
# 5 · Rohan ka pehla interview ⚡ act the interviewer · point to the screen
Do hafte baad Rohan ka pehla interview tha. Interviewer ne marksheet dekhi bhi nahi. Seedha poocha: *"AI tools aate hain? Kuch bana ke dikhao."*
Aur ye sirf Rohan ki kahani nahi. Indeed aur NASSCOM ki ek 2026 report ke mutabik, lagbhag *40% employers* kehte hain ki unhe degree se zyada *proven AI skills ya certificate* chahiye.
Pehle sawaal hota tha "kaunsa college?" Ab sawaal hai *"aap AI ke saath kya kar sakte ho? Dikhao."*
Aur achhi baat? Ye sirf bade sheher ke liye nahi. Indore ho ya Patna, jiske paas phone ya laptop aur seekhne ki bhookh hai, wo *portfolio dikha ke* naukri le sakta hai.
# 6 · Rohan ne AI ko apna coach banaya ⚡ demo energy, show the phone
Us din Rohan ne decide kiya: AI se darunga nahi, *AI ko apna coach banaunga*. 4 tarike:
*Ek:* Resume. Job description AI ko di aur bola, "Mera resume is job ke hisaab se improve karo, lekin jhooth mat likhna."
*Do:* Interview practice. "Tum interviewer ho, mujhse 5 sawaal poocho aur feedback do." Raat 2 baje bhi practice ho gayi.
*Teen:* English. Apna answer bola, AI se poocha "isse aur clear kaise bolun?"
*Chaar:* Seekhna. "Mujhe ye chai ki dukaan ke example se samjhao." Main bhi yahi karta hoon!

# 7 · Free sarkari AI course ⚡ excited, slow down on the website name

  "Money Plan 1 — RESHOOT (energy cues)": `# ⚡ Stand · 20% louder · smile · 2-3 takes per scene · say *cut this line* and restart
# 1 · Hook ⚡ STAND · SMILE · mime the phone SMS · louder than normal
Mahine ki pehli tareekh thi. Subah ke 9 baje Amit ke phone pe ek SMS aaya: *₹1,00,000 credited*. Amit muskuraya, chai ka cup uthaya, aur socha, "Is mahine toh sab set hai."
Phir aayi 25 tareekh. Wahi Amit, wahi phone. Usne balance dekha… aur ek second ke liye bilkul chup ho gaya.
Us raat khaane ke baad Neha ne dheere se poocha, "Aarav ki college fees ka kuch socha hai? Aur apna ghar… kab lenge?" Amit ke paas *koi jawab nahi* tha.
Agar ye baat aapke ghar mein bhi kabhi na kabhi hui hai, toh ye kahani aapki bhi hai.
# 2 · Intro ⚡ big smile · open arms on "Money Plan"
Main hoon *Raj*, aur ye hai *Middle-Class Family Ka Money Plan* ka Part 1. Budget se investment tak, ghar se retirement tak, sab kuch aasaan bhasha mein.
Aur is poori series mein hum ek hi family ke saath chalenge, unki har mushkil aur har faisle ke saath.
# 3 · Verma family ⚡ count the 4 people on your fingers
Toh milte hain Verma family se. Lucknow mein ek kiraye ke 2BHK mein rehte hain.
Amit 35 saal ke hain aur ek private company mein kaam karte hain. Neha 33 ki hain, aur shaam ko ghar pe bachchon ko tuition padhati hain.
Unke do bachche hain: *Aarav*, jo 8 saal ka hai aur cricket ka deewana hai, aur chhoti *Pihu*, sirf 4 saal ki.
Dono ki kamaai milake ghar mein har mahine *₹1 lakh* aata hai.
Ye family asli nahi hai, ek *example* hai. Lekin mujhe yakeen hai, kahin na kahin aapko inmein apni family dikhegi.
# 4 · Sunday hisaab ⚡ act Neha (happy) then Amit (worried) · drop voice on "job chali gayi toh?"
Ek Sunday ki dopahar, Amit aur Neha ne decide kiya ki aaj poora hisaab lagayenge. Savings account khola, usmein tha *₹60,000*. Saath mein Amit ka EPF tha, aur company ka health insurance bhi.
Neha khush ho gayi: "Dekho, na koi loan hai, na credit card ka bill. Hum toh *theek chal rahe hain*."
Par jab Amit ne ghar ka zaroori kharch joda, toh woh hi *₹58,000* mahina nikla. Matlab ye ₹60,000 bas *ek mahine* ka sahara hai. Agar kal job chali jaaye, toh doosre mahine kya hoga?
# 5 · ₹1 lakh ⚡ PUNCH every ₹ amount with a hand chop · fast list
Toh Amit ne apni purani diary nikali, aur dono ne dekhna shuru kiya ki ye ₹1 lakh aakhir jaata *kahan* hai.
Sabse bada kharcha tha kiraya, *₹18,000*. Phir ration, ₹14,000. Bijli, paani aur internet ke bills milake ₹4,000. Aane-jaane ka kharcha ₹6,000, school ka ₹10,000, aur dawai-health ka ₹6,000.
Jab total kiya, toh sirf zaroori cheezon pe hi *₹58,000* chale jaate the.
Phir Neha ko yaad aaya, "Aur woh kharche jo achaanak aa jaate hain? Diwali, admission, shaadi ke gifts?" Amit hansa, "Woh achaanak nahi aate, *har saal* aate hain." Toh unke liye har mahine ₹6,000 alag rakhe, aur thodi masti ke liye ₹5,000.
Aur jo bacha, woh tha *₹31,000*. Usmein se ₹8,000 emergency ke liye, ₹13,000 retirement ke liye, aur ₹10,000 bachchon ki padhai ke liye.
Neha ne garv se kaha, "31% bachat! Hum toh kaafi achha kar rahe hain." Amit ne haan mein sar hilaya… par mann mein ek sawaal tha: *kya ye sach mein kaafi hai?*
# 6 · Goals ⚡ point to an imaginary timeline left → right
Us raat bachchon ke sone ke baad, dono ne ek kaagaz liya aur apne saare sapne ek line mein likh diye.
Sabse pehle emergency fund, jo *abhi* chahiye. Insurance ka check bhi *abhi*. Aarav ka college lagbhag 10 saal mein aayega, aur Pihu ka 14 saal mein. Retirement 25 saal baad. Aur Amit ke mummy-papa ki care, uski zaroorat toh *kabhi bhi* pad sakti hai.
Phir Neha ne likha "apna ghar", aur uske saamne bas itna: "Kabhi na kabhi." Aur yahi asli problem hai. Har goal ki *apni deadline* hai, aur sab ek saath dastak de rahe hain.
# 7 · Jama rakam ⚡ lean in on "Bade number lagte hain na?" · slow down on "sirf jama rakam"
Amit ne phone ka calculator khola. "Padhai ke liye ₹10,000 har mahine, 10 saal tak… matlab *₹12 lakh*." Aur ye dono bachchon ke liye milake hai.
"Retirement ke liye ₹13,000, 25 saal tak… *₹39 lakh*."
Number bade lagte hain na? Lekin ye *sirf jama rakam* hai, isme na growth judi hai, na mehngai. College ka asli kharcha tab kitna hoga, woh hum Episode 41 aur 46 mein milke nikaalenge.
# 8 · Dabba ⚡ make 3 boxes in the air · stress "SABSE PEHLE SAFETY"
Us raat Amit ko ek baat samajh aa gayi. Jo paisa ek saal mein chahiye, aur jo 25 saal baad chahiye, unka plan *ek jaisa* ho hi nahi sakta.
Har goal ko apna alag *dabba* chahiye. Goal plus deadline, tab banta hai *plan*.
Aur shuruaat kahan se? *Sabse pehle safety*: emergency fund, insurance check, aur koi mehnga karz nahi. Uske baad lambe goals. Aur ye series bhi bilkul isi raaste pe chalegi.
# 9 · Aapka kaam ⚡ talk straight to the viewer · write in the air
Ab baari aapki hai. Aaj raat, Neha ki tarah, ek kaagaz lijiye aur apni family ke *5 goals* likhiye.
Har goal ke saamne do cheezein: woh *kab* chahiye, aur *lagbhag kitna*. Andaaza bhi chalega.
Aur agar kisi goal ka saal likh hi nahi paa rahe, toh samajh lijiye, woh abhi goal nahi, ek *sapna* hai. Koi baat nahi, use alag likh lijiye.
# 10 · End ⚡ smile · point to the screen on "comment" and "website"
Agle part mein hum dekhenge ki Amit ki salary aati toh hai… par phir *gayab kahan* ho jaati hai.
Tab tak comment mein bataiye, aapki family ka *sabse bada goal* kya hai?
Yaad rahe, ye ek educational example hai, *financial advice nahi*. Saare notes milenge *techsamjhoraj.com* pe. Milte hain Part 2 mein!`,

const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem("prompter:" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem("prompter:" + k, JSON.stringify(v)); } catch (e) {} }
};
let state = { script: store.get("script", Object.keys(SCRIPTS)[0]), speed: store.get("speed", 40), size: store.get("size", 56),
              narrow: store.get("narrow", true), mirror: store.get("mirror", false), custom: store.get("custom", {}) };
let running = false, y = 0, last = 0, raf = 0;

function textFor(name){ return state.custom[name] ?? SCRIPTS[name]; }
function esc(s){ return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]); }
function render(){
  const lines = textFor(state.script).split("\n").filter(l => l.trim());
  $("scroller").innerHTML = lines.map(l => l.startsWith("#")
    ? `<div class="sec">${esc(l.replace(/^#\s*/, ""))}</div>`
    : `<p class="pt">${esc(l).replace(/\*(.+?)\*/g, "<b>$1</b>")}</p>`).join("") + '<div style="height:70vh"></div>';
  apply();
}
function apply(){
  const sc = $("scroller");
  sc.style.fontSize = state.size + "px";
  document.documentElement.style.setProperty("--col", state.narrow ? "min(640px, 100%)" : "min(1100px, 100%)");
  sc.classList.toggle("mirror", state.mirror);
  sc.style.transform = (state.mirror ? "scaleX(-1) " : "") + `translateY(${-y}px)`;
  $("speedv").textContent = state.speed; $("sizev").textContent = state.size;
  $("narrow").classList.toggle("on", state.narrow); $("mirror").classList.toggle("on", state.mirror);
  $("play").textContent = running ? "❚❚ Pause" : "▶ Start"; $("play").classList.toggle("on", running);
}
function tick(ts){
  if (!running) return;
  const dt = last ? (ts - last) / 1000 : 0; last = ts;
  const max = $("scroller").scrollHeight - $("stage").clientHeight * 0.3;
  y = Math.min(max, y + state.speed * dt);
  apply();
  if (y >= max) { running = false; apply(); return; }
  raf = requestAnimationFrame(tick);
}
function start(){
  if (running) { running = false; cancelAnimationFrame(raf); apply(); return; }
  const c = $("count"); let n = 3; c.hidden = false; c.textContent = n;
  const iv = setInterval(() => {
    n -= 1;
    if (n > 0) { c.textContent = n; return; }
    clearInterval(iv); c.hidden = true; running = true; last = 0; apply(); raf = requestAnimationFrame(tick);
  }, 700);
}
function toTop(){ y = 0; running = false; cancelAnimationFrame(raf); apply(); }
function save(){ ["script", "speed", "size", "narrow", "mirror", "custom"].forEach(k => store.set(k, state[k])); }
function bump(k, d, lo, hi){ state[k] = Math.max(lo, Math.min(hi, state[k] + d)); save(); apply(); }

const sel = $("script");
sel.innerHTML = Object.keys(SCRIPTS).map(k => `<option>${k}</option>`).join("");
sel.value = SCRIPTS[state.script] ? state.script : Object.keys(SCRIPTS)[0];
sel.onchange = () => { state.script = sel.value; save(); toTop(); render(); };
$("play").onclick = start; $("top").onclick = toTop;
$("slow").onclick = () => bump("speed", -5, 5, 200); $("fast").onclick = () => bump("speed", 5, 5, 200);
$("small").onclick = () => bump("size", -4, 24, 120); $("big").onclick = () => bump("size", 4, 24, 120);
$("narrow").onclick = () => { state.narrow = !state.narrow; save(); apply(); };
$("mirror").onclick = () => { state.mirror = !state.mirror; save(); apply(); };
function openEditor(){ running = false; apply(); $("text").value = textFor(state.script); $("editor").hidden = false; $("text").focus(); }
$("edit").onclick = openEditor;
$("cancel").onclick = () => { $("editor").hidden = true; };
$("save").onclick = () => { state.custom[state.script] = $("text").value; save(); $("editor").hidden = true; toTop(); render(); };
$("reset").onclick = () => { delete state.custom[state.script]; save(); $("text").value = SCRIPTS[state.script]; };
document.addEventListener("keydown", e => {
  if (!$("editor").hidden) return;
  if (e.target.tagName === "SELECT") return;
  if (e.code === "Space") { e.preventDefault(); start(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); bump("speed", 5, 5, 200); }
  else if (e.key === "ArrowDown") { e.preventDefault(); bump("speed", -5, 5, 200); }
  else if (e.key === "+" || e.key === "=") bump("size", 4, 24, 120);
  else if (e.key === "-") bump("size", -4, 24, 120);
  else if (e.key === "Home") toTop();
  else if (e.key.toLowerCase() === "e") openEditor();
});
$("stage").addEventListener("wheel", e => { y = Math.max(0, y + e.deltaY * 0.5); apply(); }, { passive: true });
render();
</script>
