<!doctype html>
<html><head><meta charset="utf-8">
<style>

  @font-face { font-family:"JetBrains Mono"; font-weight:700; src:url("../public/fonts/JetBrainsMono-700.woff2") format("woff2"); }

  .badge { position:absolute; left:40px; top:1500px; transform:rotate(-4deg); z-index:4; background:#FFB020; color:#0E1116;

  .brand { position:absolute; z-index:5; bottom:60px; left:0; right:0; text-align:center; font-size:46px; color:rgba(245,241,232,.8); letter-spacing:.06em; }
