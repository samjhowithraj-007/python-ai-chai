<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family:"DM Sans"; font-weight:700; src:url("../assets/fonts/DMSans-700.woff2") format("woff2"); }
  @font-face { font-family:"JetBrains Mono"; font-weight:700; src:url("../assets/fonts/JetBrainsMono-700.woff2") format("woff2"); }
  html, body { margin:0; width:1080px; height:1920px; overflow:hidden; }
  body { font-family:"DM Sans", system-ui, sans-serif; font-weight:700; color:#F5F1E8; position:relative;
    background:
      radial-gradient(80% 40% at 50% 100%, rgba(255,176,32,.42), rgba(255,176,32,0) 70%),
      radial-gradient(70% 35% at 50% 0%, rgba(10,240,240,.18), rgba(10,240,240,0) 70%), #0E1116; }
  .grid { position:absolute; inset:0; opacity:.16; background-image:
      linear-gradient(rgba(245,241,232,.12) 2px, transparent 2px), linear-gradient(90deg, rgba(245,241,232,.12) 2px, transparent 2px);
      background-size:90px 90px; }
  .c { color:#0AF0F0; text-shadow:0 0 40px rgba(10,240,240,.65); }
  .a { color:#FFB020; text-shadow:0 0 40px rgba(255,176,32,.55); }
  .part { position:absolute; top:100px; left:50%; transform:translateX(-50%); padding:18px 44px; border-radius:9999px;
    border:4px solid #0AF0F0; background:rgba(10,240,240,.12); font-family:"JetBrains Mono", monospace; font-size:56px; letter-spacing:.12em; }
  .t1 { position:absolute; top:250px; left:0; right:0; text-align:center; font-size:126px; line-height:1; letter-spacing:-.03em; }
  .t2 { position:absolute; top:385px; left:0; right:0; text-align:center; font-size:190px; line-height:1; letter-spacing:-.04em; }
  .bub { position:absolute; left:120px; right:120px; top:660px; height:200px; border-radius:50px; background:#F5F1E8; color:#0E1116;
    display:flex; align-items:center; justify-content:center; font-size:82px; box-shadow:0 30px 70px rgba(0,0,0,.5); }
  .tail { position:absolute; left:220px; top:850px; }
  .term { position:absolute; left:110px; right:110px; top:1000px; background:#0A0C10; border:3px solid rgba(245,241,232,.18); border-radius:26px;
    padding:46px 54px; font-family:"JetBrains Mono", monospace; font-size:64px; line-height:1.55; box-shadow:0 30px 90px rgba(0,0,0,.6); }
  .caret { display:inline-block; width:.55em; height:1em; background:#0AF0F0; vertical-align:-.12em; margin-left:6px; }
  .badge { position:absolute; left:50%; top:1450px; transform:translateX(-50%) rotate(-3deg); background:#FFB020; color:#0E1116;
    font-size:80px; padding:22px 48px; border-radius:24px; white-space:nowrap; box-shadow:0 20px 60px rgba(255,176,32,.45); }
  .badge span { font-family:"JetBrains Mono", monospace; }
  .brand { position:absolute; bottom:60px; left:0; right:0; text-align:center; font-size:46px; color:rgba(245,241,232,.8); letter-spacing:.06em; }
</style></head>
<body>
  <div class="grid"></div>
  <div class="part">PART 8</div>
  <div class="t1">Customer se</div>
  <div class="t2 a">pucho!</div>
  <div class="bub">Kitne cup chahiye?</div>
  <svg class="tail" width="110" height="80" viewBox="0 0 110 80"><path d="M0 0 L110 0 L14 80 Z" fill="#F5F1E8"/></svg>
  <div class="term">Kitne cup? <span class="c">3</span><span class="caret"></span><br><span class="a">Bill: 60</span></div>
  <div class="badge"><span>input()</span> SAMJHO!</div>
  <div class="brand">SAMJHO WITH RAJ</div>
</body></html>
