<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family:"DM Sans"; font-weight:700; src:url("../assets/fonts/DMSans-700.woff2") format("woff2"); }
  @font-face { font-family:"JetBrains Mono"; font-weight:700; src:url("../assets/fonts/JetBrainsMono-700.woff2") format("woff2"); }
  html, body { margin:0; width:1080px; height:1920px; overflow:hidden; }
  body { font-family:"DM Sans", system-ui, sans-serif; font-weight:700; color:#F5F1E8; position:relative;
    background:
      radial-gradient(80% 40% at 50% 100%, rgba(255,176,32,.42), rgba(255,176,32,0) 70%),
      radial-gradient(70% 35% at 50% 0%, rgba(10,240,240,.18), rgba(10,240,240,0) 70%), #0E1116; }
  .grid { position:absolute; inset:0; opacity:.16; background-image:
      linear-gradient(rgba(245,241,232,.12) 2px, transparent 2px), linear-gradient(90deg, rgba(245,241,232,.12) 2px, transparent 2px);
      background-size:90px 90px; }
  .c { color:#0AF0F0; text-shadow:0 0 40px rgba(10,240,240,.65); }
  .a { color:#FFB020; text-shadow:0 0 40px rgba(255,176,32,.55); }
  .part { position:absolute; top:110px; left:50%; transform:translateX(-50%); padding:18px 44px; border-radius:9999px;
    border:4px solid #0AF0F0; background:rgba(10,240,240,.12); font-family:"JetBrains Mono", monospace; font-size:56px; letter-spacing:.12em; }
  .q { position:absolute; top:290px; left:0; right:0; text-align:center; font-size:190px; line-height:.95; letter-spacing:-.04em; }
  .ie { position:absolute; top:700px; left:0; right:0; text-align:center; font-family:"JetBrains Mono", monospace; font-size:140px; letter-spacing:-.03em; }
  .cube { position:absolute; width:150px; height:150px; border-radius:26px;
    background:linear-gradient(145deg,#FFFFFF 0%,#EDEAE2 60%,#D9D4C8 100%); box-shadow:inset 0 -12px 0 rgba(0,0,0,.08),0 20px 40px rgba(0,0,0,.5); }
  .card { position:absolute; top:960px; width:430px; height:330px; border-radius:30px; background:#181715; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:10px; box-shadow:0 30px 80px rgba(0,0,0,.55); }
  .card .t { font-family:"JetBrains Mono", monospace; font-size:52px; }
  .card .r { font-size:84px; line-height:1; text-align:center; }
  .badge { position:absolute; left:50%; top:1440px; transform:translateX(-50%) rotate(-3deg); background:#FFB020; color:#0E1116;
    font-size:80px; padding:22px 48px; border-radius:24px; white-space:nowrap; box-shadow:0 20px 60px rgba(255,176,32,.45); }
  .brand { position:absolute; bottom:60px; left:0; right:0; text-align:center; font-size:46px; color:rgba(245,241,232,.8); letter-spacing:.06em; }
</style></head>
<body>
  <div class="grid"></div>
  <div class="part">PART 3</div>
  <div class="q a">Cheeni<br>kitni?</div>
  <div class="cube" style="left:880px;top:150px;transform:rotate(14deg);width:130px;height:130px"></div>
  <div class="cube" style="left:90px;top:560px;transform:rotate(-12deg);width:120px;height:120px"></div>
  <div class="ie c">if-else</div>
  <div class="card" style="left:80px;border:5px solid #0AF0F0"><div class="t c">True</div><div class="r">Meethi<br>chai</div></div>
  <div class="card" style="right:80px;border:5px solid #FF8FA3"><div class="t" style="color:#FF8FA3">False</div><div class="r">Feeki<br>chai</div></div>
  <div class="badge">COMPUTER KA FAISLA!</div>
  <div class="brand">SAMJHO WITH RAJ</div>
</body></html>
