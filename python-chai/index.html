<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #F5F1E8;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-g9l0" id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1080">
      <div data-hf-id="hf-3x7g" id="el-01-hook" class="scene" data-composition-id="01-hook" data-composition-src="compositions/frames/01-hook.html" data-start="0" data-duration="5.5" data-track-index="0"></div>

      <div data-hf-id="hf-pm51" id="el-02-variables" class="scene" data-composition-id="02-variables" data-composition-src="compositions/frames/02-variables.html" data-start="5" data-duration="7.5" data-track-index="1"></div>

      <div data-hf-id="hf-awq1" id="el-03-function" class="scene" data-composition-id="03-function" data-composition-src="compositions/frames/03-function.html" data-start="12" data-duration="6.5" data-track-index="0"></div>

      <div data-hf-id="hf-ds3s" id="el-04-loop" class="scene" data-composition-id="04-loop" data-composition-src="compositions/frames/04-loop.html" data-start="18" data-duration="7.5" data-track-index="1"></div>

      <div data-hf-id="hf-syj9" id="el-05-cta" class="scene" data-composition-id="05-cta" data-composition-src="compositions/frames/05-cta.html" data-start="25" data-duration="5" data-track-index="0"></div>

      <!-- BGM -->
      <audio data-hf-id="hf-he9m" id="el-bgm" src="assets/audio/bgm.mp3" data-start="0" data-duration="30" data-track-index="11" data-volume="0.9"></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 5);
        tl.fromTo("#el-02-variables", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 5);
        tl.addLabel("hf:transition:01-hook:02-variables:crossfade", 5);
        tl.to("#el-02-variables", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 12);
        tl.fromTo("#el-03-function", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 12);
        tl.addLabel("hf:transition:02-variables:03-function:crossfade", 12);
        tl.to("#el-03-function", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 18);
        tl.fromTo("#el-04-loop", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 18);
        tl.addLabel("hf:transition:03-function:04-loop:crossfade", 18);
        tl.to("#el-04-loop", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 25);
        tl.fromTo("#el-05-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 25);
        tl.addLabel("hf:transition:04-loop:05-cta:crossfade", 25);
        tl.to({}, { duration: 30 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
