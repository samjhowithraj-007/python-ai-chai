<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family:"DM Sans"; font-weight:700; src:url("../assets/fonts/DMSans-700.woff2") format("woff2"); }
  @font-face { font-family:"JetBrains Mono"; font-weight:700; src:url("../assets/fonts/JetBrainsMono-700.woff2") format("woff2"); }
  html, body { margin:0; width:1080px; height:1920px; overflow:hidden; }
  body { font-family:"DM Sans", system-ui, sans-serif; font-weight:700; color:#F5F1E8; position:relative;
    background:
      radial-gradient(80% 40% at 50% 100%, rgba(255,176,32,.42), rgba(255,176,32,0) 70%),
      radial-gradient(70% 35% at 50% 0%, rgba(10,240,240,.18), rgba(10,240,240,0) 70%), #0E1116; }
  .grid { position:absolute; inset:0; opacity:.16; background-image:
      linear-gradient(rgba(245,241,232,.12) 2px, transparent 2px), linear-gradient(90deg, rgba(245,241,232,.12) 2px, transparent 2px);
      background-size:90px 90px; }
  .c { color:#0AF0F0; text-shadow:0 0 40px rgba(10,240,240,.65); }
  .a { color:#FFB020; text-shadow:0 0 40px rgba(255,176,32,.55); }
  .top { position:absolute; top:150px; left:0; right:0; text-align:center; font-size:132px; line-height:1.0; letter-spacing:-.03em; }
  .eq { position:absolute; top:470px; left:0; right:0; text-align:center; font-size:250px; line-height:.9; letter-spacing:-.04em; }
  .eq .s { font-size:150px; color:#F5F1E8; display:block; margin:10px 0; }
  .code { position:absolute; left:110px; right:110px; top:1080px; background:#181715; border:3px solid rgba(245,241,232,.18);
    border-radius:26px; padding:44px 50px; font-family:"JetBrains Mono", monospace; font-size:62px; line-height:1.5;
    box-shadow:0 30px 90px rgba(0,0,0,.6); }
  .code .k { color:#0AF0F0; } .code .f { color:#B8F5A0; }
  .badge { position:absolute; left:50%; top:1530px; transform:translateX(-50%) rotate(-3deg); background:#FFB020; color:#0E1116;
    font-size:82px; padding:22px 48px; border-radius:24px; white-space:nowrap; box-shadow:0 20px 60px rgba(255,176,32,.45); }
  .brand { position:absolute; bottom:70px; left:0; right:0; text-align:center; font-size:48px; color:rgba(245,241,232,.8); letter-spacing:.06em; }
  svg { position:absolute; }
</style></head>
<body>
  <div class="grid"></div>
  <div class="top">Coding ka <span class="a">darr</span><br>khatam!</div>
  <div class="eq"><span class="a">CHAI</span><span class="s">=</span><span class="c">PYTHON</span></div>
  <!-- chai cup, top-right of the equation -->
  <svg viewBox="0 0 300 300" width="250" height="250" style="right:40px;top:400px;transform:rotate(10deg)" fill="none">
    <path d="M78 150 L222 150 L210 252 Q208 262 198 262 L102 262 Q92 262 90 252 Z" fill="#FFB020"/>
    <path d="M70 128 L230 128 L212 254 Q209 270 194 270 L106 270 Q91 270 88 254 Z" stroke="#F5F1E8" stroke-width="9" stroke-linejoin="round"/>
    <path d="M228 160 Q268 160 266 196 Q264 228 220 230" stroke="#F5F1E8" stroke-width="9" stroke-linecap="round"/>
    <path d="M115 108 Q100 88 115 68 Q130 48 115 28 M150 108 Q135 88 150 68 Q165 48 150 28 M185 108 Q170 88 185 68 Q200 48 185 28" stroke="#F5F1E8" stroke-width="7" stroke-linecap="round" opacity=".8"/>
  </svg>
  <div class="code"><span class="k">def</span> <span class="f">chai_banao</span>():<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="k">while not</span> ubaal:<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;garam_karo()</div>
  <div class="badge">30 SEC MEIN SEEKHO!</div>
  <div class="brand">SAMJHO WITH RAJ</div>
</body></html>
