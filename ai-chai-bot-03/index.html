<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #F5F1E8;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
          #cam { position:absolute; left:770px; top:770px; width:320px; height:320px; z-index:50;
        filter: drop-shadow(0 0 22px rgba(10,240,240,.30)) drop-shadow(0 10px 30px rgba(0,0,0,.6)); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="40.2" data-width="1080" data-height="1080">
      <div id="el-01-hook" class="scene" data-composition-id="01-hook" data-composition-src="compositions/frames/01-hook.html"
        data-start="0" data-duration="4.2" data-track-index="0"></div>
      <div id="el-02-pile" class="scene" data-composition-id="02-pile" data-composition-src="compositions/frames/02-pile.html"
        data-start="3.7" data-duration="8.0" data-track-index="1"></div>
      <div id="el-03-diary" class="scene" data-composition-id="03-diary" data-composition-src="compositions/frames/03-diary.html"
        data-start="11.2" data-duration="8.0" data-track-index="0"></div>
      <div id="el-04-code" class="scene" data-composition-id="04-code" data-composition-src="compositions/frames/04-code.html"
        data-start="18.7" data-duration="10.0" data-track-index="1"></div>
      <div id="el-05-cta" class="scene" data-composition-id="05-cta" data-composition-src="compositions/frames/05-cta.html"
        data-start="28.2" data-duration="12.0" data-track-index="0"></div>
      <audio id="el-bgm" src="assets/audio/bgm.mp3" data-start="0" data-duration="30" data-track-index="11" data-volume="0.9"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 3.7);
        tl.fromTo("#el-02-pile", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 3.7);
        tl.to("#el-02-pile", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 11.2);
        tl.fromTo("#el-03-diary", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 11.2);
        tl.to("#el-03-diary", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 18.7);
        tl.fromTo("#el-04-code", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 18.7);
        tl.to("#el-04-code", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 28.2);
        tl.fromTo("#el-05-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 28.2);
        tl.to({}, { duration: 40.2 }, 0);
      })();
    </script>
  </body>
</html>
