# Publishes this site to GitHub Pages (www.paisasamjhoraj.com) on every push to main. README-only changes skip it.
name: Publish website
on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect site files
        run: mkdir site && cp -r index.html CNAME manifest.webmanifest sw.js robots.txt sitemap.xml googleef50f6b23d7dfe9f.html img site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
